name: Docker Multi-Arch Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull & Push
    runs-on: ubuntu-latest
    steps:

    - name: Before freeing up disk space
      run: |
        echo "======== Before ========"
        df -hT
        echo "========================"

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 256
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-android: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "======== After ========"
        df -hT
        docker system df 2>/dev/null || true
        echo "======================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      run: |
        # 登录阿里云
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" \
          --password-stdin "$ALIYUN_REGISTRY"

        declare -A IMAGE_DIGESTS
        declare -A IMAGE_PLATFORMS
        declare -A DUPLICATE_NAMES

        # ===== 第一遍：重名检测 =====
        declare -A TEMP_NAMESPACES
        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
          image=$(echo "$line" | awk '{print $NF}')
          image="${image%%@*}"
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
          name_space="${name_space}_"
          if [[ -n "${TEMP_NAMESPACES[$image_name]}" ]]; then
            if [[ "${TEMP_NAMESPACES[$image_name]}" != "$name_space" ]]; then
              DUPLICATE_NAMES[$image_name]="true"
            fi
          else
            TEMP_NAMESPACES[$image_name]="$name_space"
          fi
        done < images.txt

        # ===== 第二遍：拉取 + 收集 digest =====
        count=0
        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
          count=$((count + 1))

          image=$(echo "$line" | awk '{print $NF}')
          image="${image%%@*}"
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

          platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
          arch="${platform##*/}"

          echo "[$count] ▶️  docker pull $line"
          docker pull $line

          if [ -z "$platform" ]; then
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | awk -F'@' '{print $2}')
          else
            digest=$(docker buildx imagetools inspect "$image" \
              --raw 2>/dev/null | jq -r '.manifests[] | select(.platform.architecture=="'"$arch"'") | .digest' 2>/dev/null || echo "")
            if [ -z "$digest" ]; then
              digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | awk -F'@' '{print $2}')
            fi
          fi
          echo "[$count]   ↳ digest: $digest"

          existing="${IMAGE_DIGESTS[$image_name_tag]}"
          [[ ! "$existing" =~ "$digest" ]] && IMAGE_DIGESTS[$image_name_tag]="${existing}${digest} "
          existing_p="${IMAGE_PLATFORMS[$image_name_tag]}"
          [[ ! "$existing_p" =~ "$arch" ]] && IMAGE_PLATFORMS[$image_name_tag]="${existing_p}${arch} "

          docker rmi "$image" 2>/dev/null || true

          # 每 5 个镜像强制清一次 buildx 缓存
          if [ $((count % 5)) -eq 0 ]; then
            echo "🔧 清理 buildx 缓存..."
            docker buildx prune -af 2>/dev/null || true
            docker system prune -f 2>/dev/null || true
            df -hT | tail -2
          fi

        done < images.txt

        # ===== 第三遍：推送 manifest list =====
        push_ok=0
        push_fail=0
        for image_name_tag in "${!IMAGE_DIGESTS[@]}"; do
          digests="${IMAGE_DIGESTS[$image_name_tag]}"

          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
          if [[ -n "${DUPLICATE_NAMES[$image_name]}" ]]; then
            name_space=$(grep "$image_name_tag" images.txt | head -1 | awk '{print $NF}' | awk -F'/' '{if (NF>=2) print $(NF-1)}')
            target_tag="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${name_space}_${image_name_tag}"
          else
            target_tag="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"
          fi

          echo ""
          echo "═══════════════════════════════════════════════"
          echo "📦 Push: $target_tag"
          echo "   Platforms: ${IMAGE_PLATFORMS[$image_name_tag]}"
          for d in $digests; do echo "     @$d"; done
          echo "═══════════════════════════════════════════════"

          cmd="docker buildx imagetools create -t $target_tag"
          for d in $digests; do
            cmd="$cmd docker.io/library/${image_name_tag}@$d"
          done
          echo "▶️  $cmd"
          if eval $cmd; then
            echo "✅ OK: $target_tag"
            push_ok=$((push_ok + 1))
          else
            echo "❌ FAIL: $target_tag → 降级逐架构推"
            push_fail=$((push_fail + 1))
            for d in $digests; do
              docker pull "docker.io/library/${image_name_tag}@$d" 2>/dev/null || continue
              arch_d=$(echo "${d}" | head -c 12)
              docker tag "docker.io/library/${image_name_tag}@$d" "${target_tag}-${arch_d}"
              docker push "${target_tag}-${arch_d}"
              docker rmi "docker.io/library/${image_name_tag}@$d" 2>/dev/null || true
              docker rmi "${target_tag}-${arch_d}" 2>/dev/null || true
            done
          fi

          # 每个 manifest 推完也清一下
          docker buildx prune -af 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
          df -hT | tail -2
        done

        echo ""
        echo "================= 汇总 ================="
        echo "✅ 成功: $push_ok"
        echo "❌ 失败: $push_fail"
        echo "======================================="

        # 最终清理
        docker buildx prune -af 2>/dev/null || true
        docker system prune -af 2>/dev/null || true
        df -hT
